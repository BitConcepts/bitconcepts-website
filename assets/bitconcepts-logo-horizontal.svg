<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 256" role="img" aria-label="BitConcepts horizontal logo">
  <title>BitConcepts horizontal logo</title>
  <defs>
      <linearGradient id="bcGrad" gradientUnits="userSpaceOnUse" x1="0" y1="256" x2="256" y2="0">
        <stop offset="0%" stop-color="#03a1d0"/>
        <stop offset="100%" stop-color="#38c2ec"/>
      </linearGradient>
    </defs>
    <g id="bcMark">
      <!-- PCB traces feeding the spine -->
      <g fill="none" stroke="#03a1d0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 36 H64 L92 64 H98"/>
        <path d="M20 128 H98"/>
        <path d="M30 220 H64 L92 192 H98"/>
        <path d="M198 161 H216"/>
      </g>
      <!-- the B -->
      <g fill="none" stroke="url(#bcGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <path d="M104 50 V206"/>
        <path d="M104 50 H138 A33 33 0 0 1 138 116 H104"/>
        <path d="M104 116 H144 A45 45 0 0 1 144 206 H104"/>
      </g>
      <!-- via dot on the middle trace -->
      <circle cx="56" cy="128" r="4" fill="#38c2ec"/>
      <!-- node terminations: ring + core -->
      <g fill="none" stroke="#38c2ec" stroke-width="4">
        <circle cx="30" cy="36" r="8"/>
        <circle cx="20" cy="128" r="8"/>
        <circle cx="30" cy="220" r="8"/>
        <circle cx="224" cy="161" r="8"/>
      </g>
      <g fill="#38c2ec">
        <circle cx="30" cy="36" r="3"/>
        <circle cx="20" cy="128" r="3"/>
        <circle cx="30" cy="220" r="3"/>
        <circle cx="224" cy="161" r="3"/>
      </g>
    </g>
  <text x="272" y="150" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="0.5" fill="#E9EFF3">BitConcepts</text>
  <path d="M274 178 H404" fill="none" stroke="#03a1d0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="414" cy="178" r="6" fill="none" stroke="#38c2ec" stroke-width="3.5"/>
  <circle cx="414" cy="178" r="2.2" fill="#38c2ec"/>
</svg>
